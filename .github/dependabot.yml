# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates#package-ecosystem
version: 2
updates:
  # Enable version updates for Python
  - package-ecosystem: "uv"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns:
          - "*"
  # Enable updates for Github Actions
  - package-ecosystem: "github-actions"
    target-branch: "develop"
    directories:
      - "/"
      - "/ephemeral"
      - "/untagged"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
  # Enable updates for pre-commit hooks
  - package-ecosystem: "pre-commit"
    target-branch: "develop"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 14
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
